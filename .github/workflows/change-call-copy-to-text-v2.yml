name: Change call copy to text copy v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/change-call-copy-to-text-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update visible call wording to text wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          plain_replacements = {
              'Fill out our simple form or give us a call.': 'Fill out our simple form or shoot us a text!',
              'give us a call': 'shoot us a text',
              'Give us a call': 'Shoot us a text',
              'Call Now': 'Shoot us a text!',
              'Call to Discuss': 'Shoot us a text!',
              'Prefer to talk? Call us now:': 'Prefer to text? Shoot us a text!',
              'Give us a call or send us a message.': 'Shoot us a text or send us a message.',
              'call us now': 'shoot us a text',
              'Call us now': 'Shoot us a text',
          }
          for old, new in plain_replacements.items():
              html = html.replace(old, new)

          # Turn visible CTA links with the new text into SMS links.
          html = re.sub(r'href="tel:\+16514036857"([^>]*>\s*(?:<svg.*?</svg>)?\s*<span>Shoot us a text!</span>)', r'href="sms:+16514036857"\1', html, flags=re.DOTALL)
          html = re.sub(r'href="tel:\+16514036857"([^>]*>Shoot us a text!</a>)', r'href="sms:+16514036857"\1', html, flags=re.DOTALL)

          workflow_path = Path('.github/workflows/change-call-copy-to-text-v2.yml')
          if workflow_path.exists():
              workflow_path.unlink()

          if html == original:
              raise SystemExit('No changes were made; patterns may need updating.')

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit wording updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/change-call-copy-to-text-v2.yml
          git commit -m "Change call CTAs to text CTAs"
          git push
