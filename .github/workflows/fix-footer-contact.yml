name: Fix footer contact info

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-footer-contact.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove footer hours and update email
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          # Update email everywhere it appears, including mailto links.
          html = html.replace('info@hhrealtyteam.com', 'kohl@hhrealty.com')
          html = html.replace('mailto:info@hhrealtyteam.com', 'mailto:kohl@hhrealty.com')
          html = html.replace('info@hubbardhousingrealty.com', 'kohl@hhrealty.com')
          html = html.replace('mailto:info@hubbardhousingrealty.com', 'mailto:kohl@hhrealty.com')

          # Remove structured hours anywhere, including bottom/footer rows with the clock icon.
          for hours in ['Mon-Sat 8am-7pm CST', 'Mon–Sat 8am–7pm CST', 'Mon-Sat 8am - 7pm CST', 'Mon-Sat 8 AM-7 PM CST']:
              html = html.replace(hours, '')

          # Clean up visible contact rows that now contain an empty span after removing hours.
          html = re.sub(
              r'<div class="flex items-center space-x-2">\s*<svg[^>]*class="lucide lucide-clock[^>]*>.*?</svg>\s*<span>\s*</span>\s*</div>',
              '',
              html,
              flags=re.DOTALL,
          )
          html = re.sub(
              r'<div class="flex items-center space-x-2">\s*<svg[^>]*>.*?</svg>\s*</div>',
              '',
              html,
              flags=re.DOTALL,
          )

          workflow_path = Path('.github/workflows/fix-footer-contact.yml')
          if workflow_path.exists():
              workflow_path.unlink()

          if html == original:
              raise SystemExit('No changes were made; patterns may need updating.')

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit footer contact update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-footer-contact.yml
          git commit -m "Fix footer contact information"
          git push
