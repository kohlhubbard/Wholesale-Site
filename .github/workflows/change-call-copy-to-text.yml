name: Change call copy to text copy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/change-call-copy-to-text.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update call wording to text wording
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          replacements = {
              'Fill out our simple form or give us a call.': 'Fill out our simple form or shoot us a text!',
              'Call Now': 'Shoot us a text!',
              'Call to Discuss': 'Shoot us a text!',
              'Prefer to talk? Call us now:': 'Prefer to text? Shoot us a text!',
              'Give us a call or send us a message.': 'Shoot us a text or send us a message.',
              'Call 651-403-6857': 'Shoot us a text!',
              'Call (651) 403-6857': 'Shoot us a text!',
              'Call 6514036857': 'Shoot us a text!',
          }

          for old, new in replacements.items():
              html = html.replace(old, new)

          # Change text-focused CTA links from tel: to sms: while leaving the header/footer phone number link intact.
          html = html.replace('href="tel:+16514036857" class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*=&#39;size-&#39;])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive border bg-background dark:bg-input/30 dark:border-input dark:hover:bg-input/50 h-10 rounded-md px-6 has-[&gt;svg]:px-4 border-primary text-primary hover:bg-primary hover:text-white flex items-center space-x-2"', 'href="sms:+16514036857" class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*=&#39;size-&#39;])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive border bg-background dark:bg-input/30 dark:border-input dark:hover:bg-input/50 h-10 rounded-md px-6 has-[&gt;svg]:px-4 border-primary text-primary hover:bg-primary hover:text-white flex items-center space-x-2"')
          html = html.replace('href="tel:+16514036857" data-slot="button" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*=&#39;size-&#39;])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive border bg-background dark:bg-input/30 dark:border-input dark:hover:bg-input/50 h-9 px-4 py-2 has-[&gt;svg]:px-3 border-primary text-primary hover:bg-primary hover:text-white"', 'href="sms:+16514036857" data-slot="button" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*=&#39;size-&#39;])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive border bg-background dark:bg-input/30 dark:border-input dark:hover:bg-input/50 h-9 px-4 py-2 has-[&gt;svg]:px-3 border-primary text-primary hover:bg-primary hover:text-white"')
          html = html.replace('href="tel:+16514036857" class="inline-flex items-center justify-center px-6 py-2 bg-primary text-white rounded-md hover:bg-accent transition-colors"', 'href="sms:+16514036857" class="inline-flex items-center justify-center px-6 py-2 bg-primary text-white rounded-md hover:bg-accent transition-colors"')

          workflow_path = Path('.github/workflows/change-call-copy-to-text.yml')
          if workflow_path.exists():
              workflow_path.unlink()

          if html == original:
              raise SystemExit('No changes were made; patterns may need updating.')

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit wording updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/change-call-copy-to-text.yml
          git commit -m "Change call wording to text wording"
          git push
