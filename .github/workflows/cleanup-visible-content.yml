name: Cleanup visible website content

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-visible-content.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove fake reviews and top header hours
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          # Remove the top header business-hours text only.
          html = html.replace('<div class="text-sm text-muted-foreground">Mon-Sat 8am-7pm CST</div>', '')

          # Remove hero testimonial/review overlay from the main image.
          html = re.sub(
              r'<div class="absolute -bottom-6 -left-6 bg-white p-4 rounded-lg shadow-lg max-w-xs">.*?John M\. - Brooklyn Park</p></div></div></div>',
              '',
              html,
              count=1,
              flags=re.DOTALL,
          )

          # Remove all review/quote boxes inside the Recent Purchases cards.
          html = re.sub(
              r'<div class="bg-warm-cream/50 rounded-lg p-3 mb-3"><svg[^>]*class="lucide lucide-quote h-4 w-4 text-primary mb-2".*?</div>',
              '',
              html,
              flags=re.DOTALL,
          )

          # Reword the Recent Purchases intro so it no longer claims fake reviews/stories.
          html = html.replace(
              'Real stories from real Minnesota homeowners who chose our cash buying service.',
              'Examples of the types of Minnesota properties we can help with.'
          )

          # Remove fake social-proof/statistics block under Recent Purchases.
          html = re.sub(
              r'<div class="text-center"><p class="text-muted-foreground mb-4">Join hundreds of satisfied Minnesota homeowners</p>.*?</div></div></div></section><section class="py-16 lg:py-24 bg-white">',
              '</div></div></section><section class="py-16 lg:py-24 bg-white">',
              html,
              count=1,
              flags=re.DOTALL,
          )

          # Delete this temporary workflow so it is a one-time cleanup.
          workflow_path = Path('.github/workflows/cleanup-visible-content.yml')
          if workflow_path.exists():
              workflow_path.unlink()

          if html != original:
              path.write_text(html, encoding='utf-8')
          else:
              raise SystemExit('No website content changes were made; patterns may need updating.')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/cleanup-visible-content.yml
          git commit -m "Remove fake reviews and header hours" || exit 0
          git push
