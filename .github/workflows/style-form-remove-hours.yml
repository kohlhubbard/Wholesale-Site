name: Style form fields and remove hours

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/style-form-remove-hours.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add black form borders and remove structured hours
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          border_css = """

      /* Thin black borders for customer-facing offer form fields */
      .contact-offer-form input:not([type="hidden"]),
      .contact-offer-form textarea,
      .contact-offer-form select {
        border: 1px solid #000 !important;
      }
"""

          if 'Thin black borders for customer-facing offer form fields' not in html:
              # Add it to the existing custom style block for the contact form.
              html = html.replace('      .contact-offer-form select:focus-visible {', border_css + '\n      .contact-offer-form select:focus-visible {', 1)

          # Remove all visible structured-hours text.
          hours = 'Mon-Sat 8am-7pm CST'

          # Remove a footer/contact row that contains the clock icon plus the hours text.
          html = re.sub(
              r'<div class="flex items-center space-x-2"><svg[^>]*class="lucide lucide-clock[^>]*>.*?</svg><span>\s*' + re.escape(hours) + r'\s*</span></div>',
              '',
              html,
              flags=re.DOTALL,
          )

          # Remove standalone paragraph/div/span versions of the same hours.
          html = re.sub(r'<p[^>]*>\s*' + re.escape(hours) + r'\s*</p>', '', html, flags=re.DOTALL)
          html = re.sub(r'<div[^>]*>\s*' + re.escape(hours) + r'\s*</div>', '', html, flags=re.DOTALL)
          html = re.sub(r'<span>\s*' + re.escape(hours) + r'\s*</span>', '', html, flags=re.DOTALL)

          # Final plain-text cleanup in case it appears inside generated content.
          html = html.replace(hours, '')

          # Remove this one-time workflow after it runs.
          workflow_path = Path('.github/workflows/style-form-remove-hours.yml')
          if workflow_path.exists():
              workflow_path.unlink()

          if html == original:
              raise SystemExit('No changes were made; patterns may need updating.')

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit website updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/style-form-remove-hours.yml
          git commit -m "Add form field borders and remove structured hours"
          git push
