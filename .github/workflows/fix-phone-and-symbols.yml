name: Fix phone and random symbols

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-phone-and-symbols.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix phone number and mojibake symbols
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          # Phone number: update every placeholder phone link/text, including the top header.
          phone_replacements = {
              'tel:+15551234567': 'tel:+16514036857',
              'tel:5551234567': 'tel:+16514036857',
              '(555) 123-4567': '651-403-6857',
              '555-123-4567': '651-403-6857',
              '5551234567': '6514036857',
              '+1 555 123 4567': '651-403-6857',
              '+15551234567': '+16514036857',
          }
          for old, new in phone_replacements.items():
              html = html.replace(old, new)

          # Clean common mojibake / wrongly encoded characters.
          symbol_replacements = {
              'â€¢': '-',
              'â€”': '-',
              'â€“': '-',
              'âœ“': '✓',
              'Â©': '©',
              'Â®': '®',
              'Â ': ' ',
              'â€™': "'",
              'â€œ': '"',
              'â€': '"',
              'â€˜': "'",
              'â€¦': '...',
              'â€‹': '',
          }
          for old, new in symbol_replacements.items():
              html = html.replace(old, new)

          # Clean up specific phrase created by the bullet replacement.
          html = html.replace('Minnesota-based - Local team', 'Minnesota-based local team')

          # Remove any leftover mojibake chunks that are usually visible as random symbols.
          html = re.sub(r'â[\w\W]{0,2}', '', html)
          html = html.replace('Â', '')

          # Keep the repo clean by deleting this one-time workflow after it runs.
          workflow_path = Path('.github/workflows/fix-phone-and-symbols.yml')
          if workflow_path.exists():
              workflow_path.unlink()

          if html == original:
              raise SystemExit('No changes were made; patterns may need updating.')

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-phone-and-symbols.yml
          git commit -m "Fix phone number and random symbols"
          git push
