name: Add form border CSS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-form-border-css.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert form border CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          css = '''
      /* Thin black borders for customer-facing offer form fields */
      .contact-offer-form input:not([type="hidden"]),
      .contact-offer-form textarea,
      .contact-offer-form select {
        border: 1px solid #000 !important;
        box-shadow: none !important;
      }
'''

          if 'Thin black borders for customer-facing offer form fields' not in html:
              marker = '</style>\n    <script>\n      document.addEventListener'
              if marker not in html:
                  raise SystemExit('Could not find style/script marker.')
              html = html.replace(marker, css + '    </style>\n    <script>\n      document.addEventListener', 1)

          workflow_path = Path('.github/workflows/add-form-border-css.yml')
          if workflow_path.exists():
              workflow_path.unlink()

          if html == original:
              raise SystemExit('No changes were made; CSS may already exist.')

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit CSS update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-form-border-css.yml
          git commit -m "Add black borders to offer form fields"
          git push
# trigger rerun 2
