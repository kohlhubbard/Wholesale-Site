name: Update About Us copy v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-about-copy-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace About Us text block safely
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          start_marker = '<span data-slot="badge" class="inline-flex items-center justify-center rounded-md border px-2 py-0.5 text-xs font-medium w-fit whitespace-nowrap shrink-0 [&amp;&gt;svg]:size-3 gap-1 [&amp;&gt;svg]:pointer-events-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive transition-[color,box-shadow] overflow-hidden border-transparent [a&amp;]:hover:bg-primary/90 mb-4 bg-primary/10 text-primary">About Hubbard Housing Realty</span><h2 class="text-3xl lg:text-4xl font-bold text-slate-ink mb-4">Local Minnesota Home Buyers You Can Trust</h2>'
          image_marker = '<div class="relative"><div class="aspect-[4/3] rounded-lg overflow-hidden shadow-xl"><img src="./Index_files/photo-1650303323526-9e3958212685"'

          start = html.find(start_marker)
          if start == -1:
              raise SystemExit('Could not find About section start marker.')

          body_start = start + len(start_marker)
          image_start = html.find(image_marker, body_start)
          if image_start == -1:
              raise SystemExit('Could not find About section image marker.')

          new_body = '<p class="text-lg text-muted-foreground mb-6">At Hubbard Housing Realty, we believe selling a property should feel clear, simple, and stress-free. Since beginning our real estate journey, we\'ve focused on helping homeowners understand their options and find solutions that fit their situation. We work with sellers who may be dealing with repairs, inherited properties, difficult tenants, unwanted homes, or simply a need for a faster and more flexible sale. Our process is built around honest communication, transparency, and respect, so you can feel comfortable knowing what\'s happening every step of the way.</p></div>'

          html = html[:body_start] + new_body + html[image_start:]

          if 'Founded in 2018' in html or 'purchased over 150 homes' in html or 'Our Mission' in html:
              raise SystemExit('Old About copy still present after replacement.')
          if 'At Hubbard Housing Realty, we believe selling a property should feel clear' not in html:
              raise SystemExit('New About copy was not found after replacement.')

          workflow_path = Path('.github/workflows/update-about-copy-v2.yml')
          if workflow_path.exists():
              workflow_path.unlink()

          if html == original:
              raise SystemExit('No changes were made.')

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit About Us update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-about-copy-v2.yml
          git commit -m "Replace About Us body copy"
          git push
