name: Restore form and clean hours

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-form-and-clean-hours.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore form section and reapply safe content edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re

          subprocess.run(['git', 'checkout', '321697add9b568dc605a821044bba349a2b89560', '--', 'index.html'], check=True)
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          for old, new in {
              'tel:+15551234567': 'sms:+16514036857',
              'tel:5551234567': 'sms:+16514036857',
              '(555) 123-4567': '651-403-6857',
              '555-123-4567': '651-403-6857',
              '5551234567': '6514036857',
              '+1 555 123 4567': '651-403-6857',
              '+15551234567': '+16514036857',
          }.items():
              html = html.replace(old, new)

          for old, new in {
              'info@hhrealtyteam.com': 'kohl@hhrealty.com',
              'mailto:info@hhrealtyteam.com': 'mailto:kohl@hhrealty.com',
              'info@hubbardhousingrealty.com': 'kohl@hhrealty.com',
              'mailto:info@hubbardhousingrealty.com': 'mailto:kohl@hhrealty.com',
          }.items():
              html = html.replace(old, new)

          for hours in ['Mon-Sat 8am-7pm CST', 'Mon–Sat 8am–7pm CST', 'Mon-Sat 8am - 7pm CST', 'Mon-Sat 8 AM-7 PM CST']:
              html = html.replace(hours, '')

          html = re.sub(r'<a href="#recent-purchases"[^>]*>Recent Purchases</a>', '', html, flags=re.DOTALL)
          html = re.sub(r'<li>\s*<a href="#recent-purchases"[^>]*>Recent Purchases</a>\s*</li>', '', html, flags=re.DOTALL)
          html = re.sub(r'<section id="recent-purchases".*?</section>\s*(?=<section)', '', html, count=1, flags=re.DOTALL)
          html = re.sub(r'<div class="absolute bottom-4 left-4 right-4 bg-white/95.*?John M\. - Brooklyn Park.*?</div>\s*</div>', '</div>', html, count=1, flags=re.DOTALL)

          def s(*codes): return ''.join(chr(c) for c in codes)
          for bad, good in {
              s(0x00E2, 0x20AC, 0x00A2): ' ',
              s(0x00E2, 0x20AC, 0x201D): ' - ',
              s(0x00E2, 0x20AC, 0x201C): ' - ',
              s(0x00E2, 0x0153, 0x201C): '✓',
              s(0x00C2, 0x00A9): '©',
              s(0x00C2): '',
              s(0x00E2, 0x20AC, 0x2122): "'",
              s(0x00E2, 0x20AC, 0x0153): '"',
              s(0x00E2, 0x20AC, 0x009D): '"',
              s(0x00E2, 0x20AC, 0x00A6): '...',
          }.items():
              html = html.replace(bad, good)
          html = html.replace('Minnesota-based   Local team', 'Minnesota-based local team')
          html = html.replace('Minnesota-based  Local team', 'Minnesota-based local team')
          html = html.replace('Minnesota-based Local team', 'Minnesota-based local team')
          html = html.replace('A fair cash offer for your MN home  -  on your timeline.', 'A fair cash offer for your MN home on your timeline.')
          html = html.replace('A fair cash offer for your MN home - on your timeline.', 'A fair cash offer for your MN home on your timeline.')
          for old, new in {'7 - 14 days': '7 to 14 days','7-14 days': '7 to 14 days','24 - 48 hours': '24 to 48 hours','24-48 hours': '24 to 48 hours','15 - 30 minutes': '15 to 30 minutes','15-30 minutes': '15 to 30 minutes','30 - 45+': '30 to 45+','30-45+': '30 to 45+','7 - 30 days': '7 to 30 days','7-30 days': '7 to 30 days'}.items():
              html = html.replace(old, new)
          html = re.sub(chr(0x00E2) + r'.{0,2}', '', html)

          for old, new in {
              'Fill out our simple form or give us a call.': 'Fill out our simple form or shoot us a text!',
              'give us a call': 'shoot us a text',
              'Give us a call': 'Shoot us a text',
              'Call Now': 'Shoot us a text!',
              'Call to Discuss': 'Shoot us a text!',
              'Prefer to talk? Call us now:': 'Prefer to text? Shoot us a text!',
              'Give us a call or send us a message.': 'Shoot us a text or send us a message.',
              'call us now': 'shoot us a text',
              'Call us now': 'Shoot us a text',
          }.items():
              html = html.replace(old, new)
          html = re.sub(r'href="tel:\+16514036857"([^>]*>\s*(?:<svg.*?</svg>)?\s*<span>Shoot us a text!</span>)', r'href="sms:+16514036857"\1', html, flags=re.DOTALL)

          about_start = html.find('>About Hubbard Housing Realty</span><h2')
          if about_start != -1:
              h2_end = html.find('</h2>', about_start)
              img_marker = '<div class="relative"><div class="aspect-[4/3] rounded-lg overflow-hidden shadow-xl"><img src="./Index_files/photo-1650303323526-9e3958212685"'
              img_start = html.find(img_marker, h2_end)
              if h2_end != -1 and img_start != -1:
                  new_about = '</h2><p class="text-lg text-muted-foreground mb-6">At Hubbard Housing Realty, we believe selling a property should feel clear, simple, and stress-free. Since beginning our real estate journey, we\'ve focused on helping homeowners understand their options and find solutions that fit their situation. We work with sellers who may be dealing with repairs, inherited properties, difficult tenants, unwanted homes, or simply a need for a faster and more flexible sale. Our process is built around honest communication, transparency, and respect, so you can feel comfortable knowing what\'s happening every step of the way.</p></div>'
                  html = html[:h2_end] + new_about + html[img_start:]

          css = '''
      /* Thin black borders for customer-facing offer form fields */
      .contact-offer-form input:not([type="hidden"]),
      .contact-offer-form textarea,
      .contact-offer-form select {
        border: 1px solid #000 !important;
        box-shadow: none !important;
      }
'''
          if 'Thin black borders for customer-facing offer form fields' not in html:
              html = html.replace('</style>\n    <script>\n      document.addEventListener', css + '    </style>\n    <script>\n      document.addEventListener', 1)

          if 'id="lead-form"' not in html and "id='lead-form'" not in html:
              raise SystemExit('Safety check failed: lead form missing after restore.')
          if 'Mon-Sat 8am-7pm CST' in html:
              raise SystemExit('Safety check failed: hours text still exists.')

          wf = Path('.github/workflows/restore-form-and-clean-hours.yml')
          if wf.exists():
              wf.unlink()
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit restored form page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-form-and-clean-hours.yml
          git commit -m "Restore seller form and remove hours text only"
          git push
# trigger restore
