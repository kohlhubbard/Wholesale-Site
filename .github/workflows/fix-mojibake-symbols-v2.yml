name: Fix mojibake symbols v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mojibake-symbols-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace corrupted visible symbols using codepoints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          def s(*codes):
              return ''.join(chr(c) for c in codes)

          replacements = {
              s(0x00E2, 0x20AC, 0x00A2): ' ',      # â€¢ bullet
              s(0x00E2, 0x20AC, 0x201D): ' - ',    # â€” em dash mojibake
              s(0x00E2, 0x20AC, 0x201C): ' - ',    # â€“ en dash mojibake
              s(0x00E2, 0x0153, 0x201C): '✓',      # âœ“ checkmark mojibake
              s(0x00C2, 0x00A9): '©',             # Â©
              s(0x00C2): '',                       # stray Â
              s(0x00E2, 0x20AC, 0x2122): "'",     # â€™ apostrophe
              s(0x00E2, 0x20AC, 0x0153): '"',     # â€œ left quote
              s(0x00E2, 0x20AC, 0x009D): '"',     # â€� right quote
              s(0x00E2, 0x20AC, 0x00A6): '...',   # â€¦ ellipsis
          }

          for bad, good in replacements.items():
              html = html.replace(bad, good)

          html = html.replace('Minnesota-based   Local team', 'Minnesota-based local team')
          html = html.replace('Minnesota-based  Local team', 'Minnesota-based local team')
          html = html.replace('Minnesota-based Local team', 'Minnesota-based local team')
          html = html.replace('A fair cash offer for your MN home  -  on your timeline.', 'A fair cash offer for your MN home on your timeline.')
          html = html.replace('A fair cash offer for your MN home - on your timeline.', 'A fair cash offer for your MN home on your timeline.')
          html = html.replace('7 - 14 days', '7 to 14 days')
          html = html.replace('7-14 days', '7 to 14 days')
          html = html.replace('24 - 48 hours', '24 to 48 hours')
          html = html.replace('24-48 hours', '24 to 48 hours')
          html = html.replace('15 - 30 minutes', '15 to 30 minutes')
          html = html.replace('15-30 minutes', '15 to 30 minutes')
          html = html.replace('30 - 45+', '30 to 45+')
          html = html.replace('30-45+', '30 to 45+')
          html = html.replace('7 - 30 days', '7 to 30 days')
          html = html.replace('7-30 days', '7 to 30 days')

          # As a final safety net, remove any remaining visible sequences that begin with the corrupted â character.
          html = re.sub(chr(0x00E2) + r'.{0,2}', '', html)

          workflow_path = Path('.github/workflows/fix-mojibake-symbols-v2.yml')
          if workflow_path.exists():
              workflow_path.unlink()

          if html == original:
              raise SystemExit('No symbol changes were made; patterns may need updating.')

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit symbol fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-mojibake-symbols-v2.yml
          git commit -m "Clean corrupted symbols from website"
          git push
