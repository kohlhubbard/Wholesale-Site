name: Fix mojibake symbols

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mojibake-symbols.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace corrupted visible symbols
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          replacements = {
              '\u00e2\u20ac\u00a2': '-',      # â€¢
              '\u00e2\u20ac\u201d': '-',     # â€”
              '\u00e2\u20ac\u201c': '-',     # â€“
              '\u00e2\u0153\u201c': '✓',     # âœ“
              '\u00c2\u00a9': '©',          # Â©
              '\u00c2': '',                  # stray Â
              '\u00e2\u20ac\u2122': "'",    # â€™
              '\u00e2\u20ac\u0153': '"',    # â€œ
              '\u00e2\u20ac\u009d': '"',    # â€�
              '\u00e2\u20ac\u00a6': '...',    # â€¦
          }

          for bad, good in replacements.items():
              html = html.replace(bad, good)

          # Make certain visible phrases read naturally after replacement.
          html = html.replace('Minnesota-based - Local team', 'Minnesota-based local team')
          html = html.replace('7-14 days', '7 to 14 days')
          html = html.replace('24-48 hours', '24 to 48 hours')
          html = html.replace('15-30 minutes', '15 to 30 minutes')
          html = html.replace('30-45+', '30 to 45+')
          html = html.replace('7-30 days', '7 to 30 days')

          # Remove any remaining mojibake-looking sequences that may be visible.
          html = re.sub(r'\u00e2[\u0080-\uffff]{0,3}', '', html)

          workflow_path = Path('.github/workflows/fix-mojibake-symbols.yml')
          if workflow_path.exists():
              workflow_path.unlink()

          if html == original:
              raise SystemExit('No symbol changes were made; patterns may need updating.')

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit symbol fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-mojibake-symbols.yml
          git commit -m "Clean corrupted visible symbols"
          git push
