<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Hubbard Housing Realty</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182333;
      --muted: #5e6978;
      --cream: #f7f2ea;
      --copper: #b86f43;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--cream);
      color: var(--ink);
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(90vw, 620px);
      padding: 48px 32px;
      text-align: center;
      background: #fff;
      border: 1px solid rgb(24 35 51 / 10%);
      border-radius: 8px;
      box-shadow: 0 16px 40px rgb(24 35 51 / 10%);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
    }

    p {
      margin: 0 auto 28px;
      max-width: 480px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 6px;
      background: var(--copper);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Thank you.</h1>
    <p>Your property information was submitted. Kohl will review it and follow up with you soon.</p>
    <a href="/">Back to Home</a>
  </main>
</body>
</html>
